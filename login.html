<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Conferência de Folha</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<div class="login-card">
  <h1>CONFERÊNCIA DE FOLHA</h1>
  <p class="login-sub">Entre com seu usuário e senha.</p>

  <form id="login-form">
    <label for="username">Usuário</label>
    <input type="text" id="username" name="username" autocomplete="username" required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <label for="access-key">Chave de administrador <span class="optional">(somente se você for o administrador)</span></label>
    <input type="password" id="access-key" name="accessKey" autocomplete="off">

    <div id="login-error" class="alert alert-error hidden"></div>

    <button type="submit" class="btn btn-primary login-submit" id="login-submit">Entrar</button>
  </form>
</div>

<script src="js/login.js"></script>
</body>
</html>
