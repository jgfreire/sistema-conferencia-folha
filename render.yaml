# Blueprint do Render (render.com) — cria o serviço web + disco persistente do banco de
# dados automaticamente. Os valores marcados "sync: false" NUNCA ficam neste arquivo (nem no
# Git): o Render pede para você preenchê-los pela interface web na hora do deploy.
services:
  - type: web
    name: conferencia-folha
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
    disk:
      name: conferencia-folha-data
      mountPath: /var/data
      sizeGB: 1
